name: ""
namespace: data-platform

image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

service:
  # Spring gRPC default
  grpcPort: 9090
  # Optional HTTP/actuator (null = omit)
  httpPort: null

resources: {}

env: {}

# Extra env from secrets: [{ name, secretName, key }]
envFromSecret: []

ingress:
  # VPN-only gRPC front via ingress-nginx (ClusterIP) + whitelist.
  # Never public — restrict_to_vpn whitelist is required when enabled.
  enabled: false
  className: nginx
  host: ""
  clusterIssuer: letsencrypt-prod
  tlsSecretName: ""
  whitelistSourceRange: ""

keda:
  enabled: false
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 10
  consumerGroup: ""
  topics: []
  bootstrapServers: ""
